name: Bug report
description: Report a problem with this firmware for the Xiaomi AX3200 / Redmi AX6S
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What goes wrong and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: |
        LuCI shows it under *Status → Overview → Firmware Version* (`ax3200-r15`), or run `cat /etc/ax3200_release`.
      placeholder: ax3200-r15
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Xiaomi AX3200 (RB01)
        - Redmi AX6S (RB03)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How this release was installed
      options:
        - Update page in LuCI
        - ax3200-update.sh
        - Flash firmware page or sysupgrade, settings kept
        - Fresh install or settings not kept
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: The system log (`logread`), settings you changed from the defaults, packages you installed.
